aid: lightbeam-ai
name: Lightbeam
description: Lightbeam is an AI data security and guardrails platform that discovers and
  classifies sensitive data across cloud, SaaS and on-premises systems, ties that data to
  identity and access context through its Data Identity Graph, and enforces guardrails on
  how users, applications, copilots and AI agents reach it. Capabilities span AI security
  and shadow-AI detection, data security posture management (DSPM), data classification,
  risk scoring, automated remediation, access governance, privacy operations, data
  retention, breach and ransomware blast-radius reduction, and user entity behavior
  analytics. Founded by former Nutanix leaders and backed by Vertex Ventures US, 8VC,
  Village Global, Monta Vista Capital and Dropbox. Lightbeam sells to the enterprise and
  publishes no public API - its documentation portal is authentication-gated.
